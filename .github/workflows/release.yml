name: "Docker Release"

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: "Docker"
    uses: dosquad/actions/.github/workflows/docker-release.yml@main
    with:
      image: ghcr.io/dosquad/weewx
      platforms: 'linux/amd64,linux/arm64'
      enable-tag-semver: true
      enable-tag-shortsemver: true
      latest: 'auto'
    secrets: inherit
